function PiggyBanksScreen({ data, setData, toast }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [actionModal, setActionModal] = useState(null); // {type: 'deposit'|'withdraw', pig}
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ name: '', goal: '', balance: '0', color: '#10b981', icon: '🎯' });
  const [actionAmount, setActionAmount] = useState('');

  function openNew() { setEditing(null); setForm({ name: '', goal: '', balance: '0', color: '#10b981', icon: '🎯' }); setModalOpen(true); }
  function openEdit(p) { setEditing(p); setForm({ name: p.name, goal: String(p.goal || ''), balance: String(p.balance || 0), color: p.color || '#10b981', icon: p.icon || '🎯' }); setModalOpen(true); }

  function handleSave() {
    if (!form.name) { toast('Informe o nome', 'error'); return; }
    const pigs = data.piggyBanks || [];
    const pig = { ...form, goal: parseNum(form.goal), balance: parseNum(form.balance) };
    if (editing) {
      setData({ ...data, piggyBanks: pigs.map(p => p.id === editing.id ? { ...pig, id: editing.id } : p) });
    } else {
      setData({ ...data, piggyBanks: [...pigs, { ...pig, id: uid(), createdAt: new Date().toISOString() }] });
    }
    setModalOpen(false);
    toast('Caixinha salva', 'success');
  }

  function handleAction() {
    const amount = parseNum(actionAmount);
    if (amount <= 0) { toast('Valor inválido', 'error'); return; }
    const pigs = data.piggyBanks || [];
    const pig = pigs.find(p => p.id === actionModal.pig.id);
    if (!pig) return;
    if (actionModal.type === 'withdraw' && parseNum(pig.balance) < amount) { toast('Saldo insuficiente', 'error'); return; }
    const newBalance = actionModal.type === 'deposit' ? parseNum(pig.balance) + amount : parseNum(pig.balance) - amount;
    const newPigs = pigs.map(p => p.id === pig.id ? { ...p, balance: newBalance } : p);
    
    // Registra transação
    const newTxs = [...(data.transactions || [])];
    newTxs.push({
      id: uid(), date: today(), transactionDate: today(), dueDate: today(),
      type: actionModal.type === 'deposit' ? 'saida' : 'entrada',
      category: 'Caixinha', amount: amount,
      description: (actionModal.type === 'deposit' ? 'Depósito' : 'Resgate') + ' na caixinha: ' + pig.name,
      status: 'pago', paymentMethod: 'transferencia', createdAt: new Date().toISOString()
    });
    setData({ ...data, piggyBanks: newPigs, transactions: newTxs });
    setActionModal(null);
    setActionAmount('');
    toast((actionModal.type === 'deposit' ? 'Depósito' : 'Resgate') + ' realizado', 'success');
  }

  function handleDelete(id) {
    if (!confirm('Confirma a exclusão?')) return;
    setData({ ...data, piggyBanks: (data.piggyBanks || []).filter(p => p.id !== id) });
    toast('Caixinha excluída', 'success');
  }

  const totalSaved = (data.piggyBanks || []).reduce((s, p) => s + parseNum(p.balance), 0);
  const totalGoal = (data.piggyBanks || []).reduce((s, p) => s + parseNum(p.goal), 0);

  return (
    <div className="fade-in">
      <div className="flex items-center justify-between mb-6">
        <div>
          <h1 className="text-3xl font-bold text-gray-800">Caixinhas</h1>
          <p className="text-gray-500 mt-1">Total guardado: <span className="font-bold text-emerald-600">{fmtMoney(totalSaved)}</span> de {fmtMoney(totalGoal)}</p>
        </div>
        <button onClick={openNew} className="btn-primary flex items-center gap-2"> Nova Caixinha</button>
      </div>

      <div className="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl p-6 text-white mb-5">
        <h3 className="font-bold text-lg mb-2"> O que são Caixinhas?</h3>
        <p className="text-emerald-50 text-sm">
          Caixinhas são como "potes" de economia para objetivos específicos (viagem, reserva, carro novo).
          Você pode fazer <strong>depósitos</strong> (guardar dinheiro) e <strong>resgates</strong> (retirar) a qualquer momento.
          Cada caixinha tem uma meta e mostra o progresso visualmente.
        </p>
      </div>

      {(data.piggyBanks || []).length === 0 ? (
        <EmptyState icon="🐷" title="Nenhuma caixinha" description="Crie sua primeira caixinha de economia" action={<button onClick={openNew} className="btn-primary">Criar caixinha</button>} />
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          {(data.piggyBanks || []).map(p => {
            const pct = p.goal > 0 ? (parseNum(p.balance) / parseNum(p.goal)) * 100 : 0;
            return (
              <div key={p.id} className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 card-hover">
                <div className="flex items-start justify-between mb-4">
                  <div className="flex items-center gap-3">
                    <div className="w-14 h-14 rounded-xl flex items-center justify-center text-3xl" style={{ backgroundColor: p.color + '20' }}>{p.icon}</div>
                    <div>
                      <p className="font-bold text-gray-800">{p.name}</p>
                      <p className="text-xs text-gray-500">Meta: {fmtMoney(p.goal)}</p>
                    </div>
                  </div>
                  <div className="flex gap-1">
                    <button onClick={() => openEdit(p)} className="p-2 text-indigo-600 hover:bg-indigo-50 rounded-lg">✏️</button>
                    <button onClick={() => handleDelete(p.id)} className="p-2 text-rose-600 hover:bg-rose-50 rounded-lg">🗑️</button>
                  </div>
                </div>
                <div className="mb-3">
                  <div className="flex justify-between text-sm mb-1">
                    <span className="text-gray-600">Progresso</span>
                    <span className="font-bold">{pct.toFixed(0)}%</span>
                  </div>
                  <div className="h-3 bg-gray-100 rounded-full overflow-hidden">
                    <div className="h-full rounded-full transition-all" style={{width: Math.min(pct, 100) + '%', background: p.color}}></div>
                  </div>
                </div>
                <div className="flex justify-between items-end mb-4">
                  <div>
                    <p className="text-xs text-gray-500">Saldo atual</p>
                    <p className="text-2xl font-bold text-gray-800">{fmtMoney(p.balance)}</p>
                  </div>
                  <div className="text-right">
                    <p className="text-xs text-gray-500">Falta</p>
                    <p className="text-sm font-bold text-gray-600">{fmtMoney(Math.max(0, parseNum(p.goal) - parseNum(p.balance)))}</p>
                  </div>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => { setActionModal({type: 'deposit', pig: p}); setActionAmount(''); }} className="flex-1 btn-success text-sm py-2">💰 Depositar</button>
                  <button onClick={() => { setActionModal({type: 'withdraw', pig: p}); setActionAmount(''); }} className="flex-1 btn-secondary text-sm py-2">💸 Resgatar</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={editing ? 'Editar Caixinha' : 'Nova Caixinha'} size="sm"
        footer={<div className="flex justify-end gap-3"><button onClick={() => setModalOpen(false)} className="btn-secondary">Cancelar</button><button onClick={handleSave} className="btn-primary">Salvar</button></div>}>
        <Field label="Nome" required><input className="input-base" value={form.name} onChange={e => setForm({...form, name: e.target.value})} /></Field>
        <Field label="Ícone (emoji)"><input className="input-base" value={form.icon} onChange={e => setForm({...form, icon: e.target.value})} maxLength="4" /></Field>
        <Field label="Meta (R$)"><input className="input-base" type="number" step="0.01" value={form.goal} onChange={e => setForm({...form, goal: e.target.value})} /></Field>
        <Field label="Saldo inicial (R$)"><input className="input-base" type="number" step="0.01" value={form.balance} onChange={e => setForm({...form, balance: e.target.value})} /></Field>
        <Field label="Cor"><input type="color" value={form.color} onChange={e => setForm({...form, color: e.target.value})} className="w-full h-11 rounded-lg border border-gray-300" /></Field>
      </Modal>

      <Modal open={!!actionModal} onClose={() => setActionModal(null)} title={actionModal?.type === 'deposit' ? '💰 Depositar' : '💸 Resgatar'} size="sm"
        footer={<div className="flex justify-end gap-3"><button onClick={() => setActionModal(null)} className="btn-secondary">Cancelar</button><button onClick={handleAction} className={actionModal?.type === 'deposit' ? 'btn-success' : 'btn-primary'}>Confirmar</button></div>}>
        {actionModal && (
          <>
            <p className="text-gray-600 mb-4">{actionModal.type === 'deposit' ? 'Depositar' : 'Resgatar'} na caixinha <strong>{actionModal.pig.name}</strong></p>
            <p className="text-sm text-gray-500 mb-3">Saldo atual: <strong>{fmtMoney(actionModal.pig.balance)}</strong></p>
            <Field label="Valor (R$)" required><input className="input-base" type="number" step="0.01" value={actionAmount} onChange={e => setActionAmount(e.target.value)} /></Field>
          </>
        )}
      </Modal>
    </div>
  );
}

// ============================================================
// CONTAS A PAGAR / RECEBER
// ============================================================
function BillsScreen({ data, setData, toast }) {
  const [tab, setTab] = useState('pay');
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ description: '', amount: '', dueDate: today(), category: '', status: 'pendente', accountId: '' });

  const bills = tab === 'pay' ? (data.billsPay || []) : (data.billsRecv || []);

  function openNew() { setEditing(null); setForm({ description: '', amount: '', dueDate: today(), category: '', status: 'pendente', accountId: '' }); setModalOpen(true); }
  function openEdit(b) { setEditing(b); setForm({ description: b.description, amount: String(b.amount), dueDate: b.dueDate, category: b.category || '', status: b.status, accountId: b.accountId || '' }); setModalOpen(true); }

  function handleSave() {
    if (!form.description || !form.amount) { toast('Preencha descrição e valor', 'error'); return; }
    const key = tab === 'pay' ? 'billsPay' : 'billsRecv';
    const list = data[key] || [];
    const bill = { ...form, amount: parseNum(form.amount) };
    if (editing) {
      setData({ ...data, [key]: list.map(b => b.id === editing.id ? { ...bill, id: editing.id } : b) });
    } else {
      setData({ ...data, [key]: [...list, { ...bill, id: uid(), createdAt: new Date().toISOString() }] });
    }
    setModalOpen(false);
    toast('Conta salva', 'success');
  }

  function handlePay(id) {
    const key = tab === 'pay' ? 'billsPay' : 'billsRecv';
    const list = (data[key] || []).map(b => b.id === id ? { ...b, status: b.status === 'pago' ? 'pendente' : 'pago', paidDate: b.status === 'pago' ? null : today() } : b);
    const bill = (data[key] || []).find(b => b.id === id);
    // Registra transação ao pagar
    const newTxs = [...(data.transactions || [])];
    if (bill && bill.status !== 'pago') {
      newTxs.push({
        id: uid(), date: today(), transactionDate: today(), dueDate: bill.dueDate,
        type: tab === 'pay' ? 'saida' : 'entrada', category: bill.category || 'Conta', amount: bill.amount,
        description: (tab === 'pay' ? 'Pagamento: ' : 'Recebimento: ') + bill.description,
        status: 'pago', paymentMethod: 'pix', accountId: bill.accountId || '', createdAt: new Date().toISOString()
      });
    }
    setData({ ...data, [key]: list, transactions: newTxs });
    toast('Status atualizado', 'success');
  }

  function handleDelete(id) {
    if (!confirm('Confirma a exclusão?')) return;
    const key = tab === 'pay' ? 'billsPay' : 'billsRecv';
    setData({ ...data, [key]: (data[key] || []).filter(b => b.id !== id) });
    toast('Conta excluída', 'success');
  }

  const totalPending = bills.filter(b => b.status === 'pendente').reduce((s, b) => s + parseNum(b.amount), 0);
  const totalPaid = bills.filter(b => b.status === 'pago').reduce((s, b) => s + parseNum(b.amount), 0);
  const overdue = bills.filter(b => b.status === 'pendente' && b.dueDate < today()).length;

  return (
    <div className="fade-in">
      <div className="flex items-center justify-between mb-6">
        <div>
          <h1 className="text-3xl font-bold text-gray-800">Contas a {tab === 'pay' ? 'Pagar' : 'Receber'}</h1>
          <p className="text-gray-500 mt-1">Pendentes: {fmtMoney(totalPending)} • Pagas: {fmtMoney(totalPaid)} {overdue > 0 && <span className="text-rose-600 font-bold">• {overdue} vencidas!</span>}</p>
        </div>
        <div className="flex gap-2">
          <button onClick={() => setTab('pay')} className={'tab-btn ' + (tab === 'pay' ? 'active' : '')}>📋 A Pagar</button>
          <button onClick={() => setTab('recv')} className={'tab-btn ' + (tab === 'recv' ? 'active' : '')}>📋 A Receber</button>
          <button onClick={openNew} className="btn-primary flex items-center gap-2">➕ Nova Conta</button>
        </div>
      </div>

      <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <table className="w-full">
          <thead className="bg-gray-50"><tr>
            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Vencimento</th>
            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Descrição</th>
            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Categoria</th>
            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Status</th>
            <th className="px-4 py-3 text-right text-xs font-semibold text-gray-600">Valor</th>
            <th className="px-4 py-3 text-right text-xs font-semibold text-gray-600">Ações</th>
          </tr></thead>
          <tbody className="divide-y">
            {bills.length === 0 ? (
              <tr><td colSpan="6" className="text-center py-12 text-gray-400">Nenhuma conta</td></tr>
            ) : bills.sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate)).map(b => {
              const isOverdue = b.status === 'pendente' && b.dueDate < today();
              return (
                <tr key={b.id} className={'hover:bg-gray-50 ' + (isOverdue ? 'bg-rose-50' : '')}>
                  <td className="px-4 py-3 text-sm">{fmtDate(b.dueDate)} {isOverdue && <span className="chip bg-rose-100 text-rose-700 ml-1">Vencida</span>}</td>
                  <td className="px-4 py-3 text-sm font-medium text-gray-800">{b.description}</td>
                  <td className="px-4 py-3 text-sm text-gray-600">{b.category || '-'}</td>
                  <td className="px-4 py-3"><span className={'chip ' + (b.status === 'pago' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700')}>{b.status === 'pago' ? 'Pago' : 'Pendente'}</span></td>
                  <td className={'px-4 py-3 text-sm font-bold text-right ' + (tab === 'pay' ? 'text-rose-600' : 'text-emerald-600')}>{fmtMoney(b.amount)}</td>
                  <td className="px-4 py-3 text-right">
                    <button onClick={() => handlePay(b.id)} className="text-indigo-600 hover:text-indigo-800 mr-2 text-sm">{b.status === 'pago' ? '↩️' : '✅'}</button>
                    <button onClick={() => openEdit(b)} className="text-indigo-600 hover:text-indigo-800 mr-2">✏️</button>
                    <button onClick={() => handleDelete(b.id)} className="text-rose-600">🗑️</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={'Nova Conta a ' + (tab === 'pay' ? 'Pagar' : 'Receber')} size="md"
        footer={<div className="flex justify-end gap-3"><button onClick={() => setModalOpen(false)} className="btn-secondary">Cancelar</button><button onClick={handleSave} className="btn-primary">Salvar</button></div>}>
        <Field label="Descrição" required><input className="input-base" value={form.description} onChange={e => setForm({...form, description: e.target.value})} /></Field>
        <div className="grid grid-cols-2 gap-4">
          <Field label="Valor (R$)" required><input className="input-base" type="number" step="0.01" value={form.amount} onChange={e => setForm({...form, amount: e.target.value})} /></Field>
          <Field label="Vencimento" required><input className="input-base" type="date" value={form.dueDate} onChange={e => setForm({...form, dueDate: e.target.value})} /></Field>
          <Field label="Categoria"><input className="input-base" value={form.category} onChange={e => setForm({...form, category: e.target.value})} /></Field>
          <Field label="Status">
            <select className="input-base" value={form.status} onChange={e => setForm({...form, status: e.target.value})}>
              <option value="pendente">Pendente</option><option value="pago">Pago</option>
            </select>
          </Field>
        </div>
      </Modal>
    </div>
  );
}

// ============================================================
// EMPRÉSTIMOS
// ============================================================
function LoansScreen({ data, setData, toast }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ name: '', value: '', balance: '', rate: '', installments: '12', startDate: today(), status: 'ativo' });

  function openNew() { setEditing(null); setForm({ name: '', value: '', balance: '', rate: '', installments: '12', startDate: today(), status: 'ativo' }); setModalOpen(true); }
  function openEdit(l) { setEditing(l); setForm({ name: l.name, value: String(l.value), balance: String(l.balance || l.value), rate: String(l.rate || ''), installments: String(l.installments || 12), startDate: l.startDate, status: l.status || 'ativo' }); setModalOpen(true); }

  function handleSave() {
    if (!form.name || !form.value) { toast('Preencha nome e valor', 'error'); return; }
    const loans = data.loans || [];
    const loan = { ...form, value: parseNum(form.value), balance: parseNum(form.balance || form.value), rate: parseNum(form.rate), installments: Number(form.installments) || 12 };
    if (editing) {
      setData({ ...data, loans: loans.map(l => l.id === editing.id ? { ...loan, id: editing.id } : l) });
    } else {
      setData({ ...data, loans: [...loans, { ...loan, id: uid(), createdAt: new Date().toISOString() }] });
    }
    setModalOpen(false);
    toast('Empréstimo salvo', 'success');
  }

  function handlePayInstallment(id) {
    const loans = data.loans || [];
    const loan = loans.find(l => l.id === id);
    if (!loan) return;
    const installmentValue = parseNum(loan.value) / loan.installments;
    const newBalance = Math.max(0, parseNum(loan.balance) - installmentValue);
    const newLoans = loans.map(l => l.id === id ? { ...l, balance: newBalance, status: newBalance <= 0 ? 'quitado' : 'ativo' } : l);
    const newTxs = [...(data.transactions || [])];
    newTxs.push({
      id: uid(), date: today(), transactionDate: today(), dueDate: today(),
      type: 'saida', category: 'Empréstimo', amount: installmentValue,
      description: 'Parcela empréstimo: ' + loan.name,
      status: 'pago', paymentMethod: 'transferencia', createdAt: new Date().toISOString()
    });
    setData({ ...data, loans: newLoans, transactions: newTxs });
    toast('Parcela paga', 'success');
  }

  function handleDelete(id) {
    if (!confirm('Confirma a exclusão?')) return;
    setData({ ...data, loans: (data.loans || []).filter(l => l.id !== id) });
    toast('Empréstimo excluído', 'success');
  }

  const totalDebt = (data.loans || []).filter(l => l.status !== 'quitado').reduce((s, l) => s + parseNum(l.balance), 0);
  const totalOriginal = (data.loans || []).reduce((s, l) => s + parseNum(l.value), 0);

  return (
    <div className="fade-in">
      <div className="flex items-center justify-between mb-6">
        <div>
          <h1 className="text-3xl font-bold text-gray-800">Empréstimos</h1>
          <p className="text-gray-500 mt-1">Dívida total: <span className="font-bold text-rose-600">{fmtMoney(totalDebt)}</span> de {fmtMoney(totalOriginal)}</p>
        </div>
        <button onClick={openNew} className="btn-primary flex items-center gap-2">➕ Novo Empréstimo</button>
      </div>

      {(data.loans || []).length === 0 ? (
        <EmptyState icon="🤝" title="Nenhum empréstimo" description="Registre seus empréstimos e financiamentos" action={<button onClick={openNew} className="btn-primary">Adicionar</button>} />
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
          {(data.loans || []).map(l => {
            const pct = parseNum(l.value) > 0 ? (parseNum(l.balance) / parseNum(l.value)) * 100 : 0;
            return (
              <div key={l.id} className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 card-hover">
                <div className="flex items-start justify-between mb-4">
                  <div>
                    <p className="font-bold text-gray-800 text-lg">{l.name}</p>
                    <p className="text-xs text-gray-500">{l.installments}x • Taxa: {l.rate}% a.m.</p>
                  </div>
                  <span className={'chip ' + (l.status === 'quitado' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700')}>{l.status === 'quitado' ? 'Quitado' : 'Ativo'}</span>
                </div>
                <div className="mb-3">
                  <div className="flex justify-between text-sm mb-1"><span className="text-gray-600">Pago</span><span className="font-bold">{(100 - pct).toFixed(0)}%</span></div>
                  <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
                    <div className="h-full bg-emerald-500 rounded-full" style={{width: (100 - pct) + '%'}}></div>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3 text-sm mb-4">
                  <div><p className="text-xs text-gray-500">Valor original</p><p className="font-bold">{fmtMoney(l.value)}</p></div>
                  <div><p className="text-xs text-gray-500">Saldo devedor</p><p className="font-bold text-rose-600">{fmtMoney(l.balance)}</p></div>
                </div>
                <div className="flex gap-2">
                  {l.status !== 'quitado' && <button onClick={() => handlePayInstallment(l.id)} className="flex-1 btn-success text-sm py-2">💰 Pagar Parcela</button>}
                  <button onClick={() => openEdit(l)} className="btn-secondary text-sm py-2 px-3">✏️</button>
                  <button onClick={() => handleDelete(l.id)} className="btn-danger text-sm py-2 px-3">🗑️</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={editing ? 'Editar Empréstimo' : 'Novo Empréstimo'} size="md"
        footer={<div className="flex justify-end gap-3"><button onClick={() => setModalOpen(false)} className="btn-secondary">Cancelar</button><button onClick={handleSave} className="btn-primary">Salvar</button></div>}>
        <Field label="Nome" required><input className="input-base" value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="Ex: Financiamento Carro" /></Field>
        <div className="grid grid-cols-2 gap-4">
          <Field label="Valor Total (R$)" required><input className="input-base" type="number" step="0.01" value={form.value} onChange={e => setForm({...form, value: e.target.value})} /></Field>
          <Field label="Saldo Atual (R$)"><input className="input-base" type="number" step="0.01" value={form.balance} onChange={e => setForm({...form, balance: e.target.value})} /></Field>
          <Field label="Taxa (% a.m.)"><input className="input-base" type="number" step="0.01" value={form.rate} onChange={e => setForm({...form, rate: e.target.value})} /></Field>
          <Field label="Parcelas"><input className="input-base" type="number" value={form.installments} onChange={e => setForm({...form, installments: e.target.value})} /></Field>
          <Field label="Data Início"><input className="input-base" type="date" value={form.startDate} onChange={e => setForm({...form, startDate: e.target.value})} /></Field>
          <Field label="Status">
            <select className="input-base" value={form.status} onChange={e => setForm({...form, status: e.target.value})}>
              <option value="ativo">Ativo</option><option value="quitado">Quitado</option>
            </select>
          </Field>
        </div>
      </Modal>
    </div>
  );
}

              <div key={type} className="p-3 bg-gray-50 rounded-lg">
                <p className="text-xs text-gray-500 capitalize">{type.replace('-', ' ')}</p>
                <p className="font-bold text-gray-800">{fmtMoney(val)}</p>

            </select>

          <Field label="Valor (R$)" required><input className="input-base" type="number" step="0.01" value={form.value} onChange={e => setForm({...form, value: e.target.value})} /></Field>
          <Field label="Rentabilidade (%)"><input className="input-base" type="number" step="0.01" value={form.rate} onChange={e => setForm({...form, rate: e.target.value})} /></Field>
          <Field label="Data Início"><input className="input-base" type="date" value={form.startDate} onChange={e => setForm({...form, startDate: e.target.value})} /></Field>

      </Modal>
    </div>
  );
}

// ============================================================
// LANÇAMENTOS
// ============================================================
function TransactionsScreen({ data, setData, toast }) {
  const [filter, setFilter] = useState({ type: 'all', category: 'all', account: 'all', status: 'all', dateFrom: '', dateTo: '', search: '' });
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ date: today(), transactionDate: today(), dueDate: '', type: 'saida', category: '', amount: '', description: '', accountId: '', paymentMethod: 'pix', creditCardId: '', status: 'pago', installment: 0, installmentOf: 0 });

  function openNew() {
    setEditing(null);
    setForm({ date: today(), transactionDate: today(), dueDate: today(), type: 'saida', category: '', amount: '', description: '', accountId: (data.accounts && data.accounts[0] ? data.accounts[0].id : ''), paymentMethod: 'pix', creditCardId: '', status: 'pago', installment: 0, installmentOf: 0 });
    setModalOpen(true);
  }
  function openEdit(t) {
    setEditing(t);
    setForm({ date: t.date || today(), transactionDate: t.transactionDate || t.date || today(), dueDate: t.dueDate || t.date || today(), type: t.type, category: t.category || '', amount: String(t.amount || ''), description: t.description || '', accountId: t.accountId || '', paymentMethod: t.paymentMethod || 'pix', creditCardId: t.creditCardId || '', status: t.status || 'pago', installment: t.installment || 0, installmentOf: t.installmentOf || 0 });
    setModalOpen(true);
  }

  function handleSave() {
    if (!form.date || !form.category || !form.amount) { toast('Preencha data, categoria e valor', 'error'); return; }
    const txs = data.transactions || [];
    const tx = { ...form, amount: parseNum(form.amount), installment: Number(form.installment) || 0, installmentOf: Number(form.installmentOf) || 0 };
    if (editing) {
      setData({ ...data, transactions: txs.map(t => t.id === editing.id ? { ...tx, id: editing.id } : t) });
    } else {
      setData({ ...data, transactions: [...txs, { ...tx, id: uid(), createdAt: new Date().toISOString() }] });
    }
    setModalOpen(false);
    toast('Lançamento salvo', 'success');
  }

  function handleDelete(id) {
    if (!confirm('Confirma a exclusão?')) return;
    setData({ ...data, transactions: (data.transactions || []).filter(t => t.id !== id) });
    toast('Lançamento excluído', 'success');
  }

  const filtered = useMemo(() => {
    return (data.transactions || []).filter(t => {
      if (filter.type !== 'all' && t.type !== filter.type) return false;
      if (filter.category !== 'all' && t.category !== filter.category) return false;
      if (filter.account !== 'all' && t.accountId !== filter.account) return false;
      if (filter.status !== 'all' && t.status !== filter.status) return false;
      if (filter.dateFrom && t.date < filter.dateFrom) return false;
      if (filter.dateTo && t.date > filter.dateTo) return false;
      if (filter.search) {
        const s = filter.search.toLowerCase();
        if (!(t.description || '').toLowerCase().includes(s) && !(t.category || '').toLowerCase().includes(s)) return false;
      }
      return true;
    }).sort((a, b) => new Date(b.date) - new Date(a.date));
  }, [data.transactions, filter]);

  return (
    <div className="fade-in">
      <div className="flex items-center justify-between mb-6">
        <div><h1 className="text-3xl font-bold text-gray-800">Lançamentos</h1><p className="text-gray-500 mt-1">{filtered.length} registros</p></div>
        <button onClick={openNew} className="btn-primary flex items-center gap-2">➕ Novo Lançamento</button>
      </div>

      <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-5">
        <h3 className="font-semibold text-gray-700 mb-3">🔍 Filtros Avançados</h3>
        <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-3">
          <select className="input-base" value={filter.type} onChange={e => setFilter({...filter, type: e.target.value})}>
            <option value="all">Todos os tipos</option><option value="entrada">Entradas</option><option value="saida">Saídas</option>
          </select>
          <select className="input-base" value={filter.category} onChange={e => setFilter({...filter, category: e.target.value})}>
            <option value="all">Todas categorias</option>
            {(data.categories || []).map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
          </select>
          <select className="input-base" value={filter.account} onChange={e => setFilter({...filter, account: e.target.value})}>
            <option value="all">Todas contas</option>
            {(data.accounts || []).map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
          </select>
          <select className="input-base" value={filter.status} onChange={e => setFilter({...filter, status: e.target.value})}>
            <option value="all">Todos status</option><option value="pago">Pagos</option><option value="pendente">Pendentes</option><option value="cancelado">Cancelados</option>
          </select>
          <input type="date" className="input-base" value={filter.dateFrom} onChange={e => setFilter({...filter, dateFrom: e.target.value})} />
          <input type="date" className="input-base" value={filter.dateTo} onChange={e => setFilter({...filter, dateTo: e.target.value})} />
          <input type="text" className="input-base md:col-span-3 lg:col-span-6" value={filter.search} onChange={e => setFilter({...filter, search: e.target.value})} placeholder=" Buscar..." />
        </div>
      </div>

      <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full">
            <thead className="bg-gray-50"><tr>
              <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Data</th>
              <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Tipo</th>
              <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Categoria</th>
              <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Descrição</th>
              <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Status</th>
              <th className="px-4 py-3 text-right text-xs font-semibold text-gray-600">Valor</th>
              <th className="px-4 py-3 text-right text-xs font-semibold text-gray-600">Ações</th>
            </tr></thead>
            <tbody className="divide-y">
              {filtered.length === 0 ? <tr><td colSpan="7" className="text-center py-12 text-gray-400">Nenhum lançamento</td></tr> : filtered.map(t => (
                <tr key={t.id} className="hover:bg-gray-50">
                  <td className="px-4 py-3 text-sm">{fmtDate(t.date)}</td>
                  <td className="px-4 py-3"><span className={'chip ' + (t.type === 'entrada' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700')}>{t.type === 'entrada' ? 'Entrada' : 'Saída'}</span></td>
                  <td className="px-4 py-3 text-sm">{t.category}</td>
                  <td className="px-4 py-3 text-sm text-gray-600 max-w-xs truncate">{t.description || '-'} {t.installmentOf > 0 && <span className="chip bg-indigo-100 text-indigo-700 ml-1">{t.installment}/{t.installmentOf}</span>}</td>

                  </td>

          <Field label="Data Transação" required><input className="input-base" type="date" value={form.transactionDate} onChange={e => setForm({...form, transactionDate: e.target.value})} /></Field>

          <Field label="Total Parcelas"><input className="input-base" type="number" min="0" value={form.installmentOf} onChange={e => setForm({...form, installmentOf: e.target.value})} /></Field>
          <div className="md:col-span-3"><Field label="Descrição"><textarea className="input-base" rows="2" value={form.description} onChange={e => setForm({...form, description: e.target.value})}></textarea></Field></div>
        </div>
      </Modal>
    </div>
  );
}

// ============================================================
// RECORRENTES
// ============================================================
function RecurringScreen({ data, setData, toast }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ name: '', category: '', amount: '', frequency: 'mensal', dayOfMonth: '10', startDate: today(), endDate: '', active: true, type: 'saida', accountId: '', paymentMethod: 'boleto' });

  function openNew() { setEditing(null); setForm({ name: '', category: '', amount: '', frequency: 'mensal', dayOfMonth: '10', startDate: today(), endDate: '', active: true, type: 'saida', accountId: '', paymentMethod: 'boleto' }); setModalOpen(true); }
  function openEdit(r) { setEditing(r); setForm({ name: r.name, category: r.category, amount: String(r.amount), frequency: r.frequency, dayOfMonth: String(r.dayOfMonth), startDate: r.startDate, endDate: r.endDate || '', active: r.active, type: r.type, accountId: r.accountId || '', paymentMethod: r.paymentMethod || 'boleto' }); setModalOpen(true); }

  function handleSave() {
    if (!form.name || !form.category || !form.amount) { toast('Preencha os campos obrigatórios', 'error'); return; }
    const recs = data.recurring || [];
    const rec = { ...form, amount: parseNum(form.amount), dayOfMonth: Number(form.dayOfMonth) || 10 };
    if (editing) {
      setData({ ...data, recurring: recs.map(r => r.id === editing.id ? { ...rec, id: editing.id } : r) });
    } else {
      setData({ ...data, recurring: [...recs, { ...rec, id: uid(), createdAt: new Date().toISOString() }] });
    }
    setModalOpen(false);
    toast('Recorrência salva', 'success');
  }

  function handleDelete(id) {
    if (!confirm('Confirma a exclusão?')) return;
    setData({ ...data, recurring: (data.recurring || []).filter(r => r.id !== id) });
    toast('Recorrência excluída', 'success');
  }

  function generateMonthly() {
    const recs = (data.recurring || []).filter(r => r.active && r.frequency === 'mensal');
    if (recs.length === 0) { toast('Nenhuma recorrência ativa', 'error'); return; }
    const txs = data.transactions || [];
    const now = new Date();
    const monthStr = now.toISOString().substring(0, 7);
    let count = 0;
    recs.forEach(rec => {
      const exists = txs.some(t => t.recurringId === rec.id && t.date && t.date.startsWith(monthStr));
      if (exists) return;
      const due = new Date(now.getFullYear(), now.getMonth(), rec.dayOfMonth);
      txs.push({
        id: uid(), date: today(), transactionDate: today(), dueDate: due.toISOString().split('T')[0],
        type: rec.type, category: rec.category, amount: rec.amount,
        description: rec.name + ' (automático)',
        accountId: rec.accountId || '', paymentMethod: rec.paymentMethod || 'boleto',
        status: 'pendente', installment: 0, installmentOf: 0, recurringId: rec.id, createdAt: new Date().toISOString(),
      });
      count++;
    });
    setData({ ...data, transactions: txs });
    toast(count + ' lançamentos gerados', 'success');
  }

  return (
    <div className="fade-in">
      <div className="flex items-center justify-between mb-6">
        <div><h1 className="text-3xl font-bold text-gray-800">Lançamentos Recorrentes</h1><p className="text-gray-500 mt-1">Contas fixas automáticas</p></div>
        <div className="flex gap-2">
          <button onClick={generateMonthly} className="btn-secondary flex items-center gap-2">🔄 Gerar Mensal</button>
          <button onClick={openNew} className="btn-primary flex items-center gap-2">➕ Nova Recorrência</button>
        </div>
      </div>

      {(data.recurring || []).length === 0 ? (
        <EmptyState icon="🔄" title="Nenhuma recorrência" description="Cadastre contas fixas como luz, água, aluguel" action={<button onClick={openNew} className="btn-primary">Adicionar</button>} />
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          {(data.recurring || []).map(r => {
            const cat = (data.categories || []).find(c => c.name === r.category);
            return (
              <div key={r.id} className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 card-hover">
                <div className="flex items-start justify-between mb-3">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-lg flex items-center justify-center text-xl" style={{ backgroundColor: (cat ? cat.color : '#6366f1') + '20' }}>{r.type === 'entrada' ? '' : '📉'}</div>
                    <div><p className="font-bold text-gray-800">{r.name}</p><p className="text-xs text-gray-500">{r.category}</p></div>
                  </div>
                  <span className={'chip ' + (r.active ? 'bg-emerald-100 text-emerald-700' : 'bg-gray-200 text-gray-600')}>{r.active ? 'Ativo' : 'Inativo'}</span>
                </div>
                <div className="space-y-2 text-sm">
                  <div className="flex justify-between"><span className="text-gray-500">Valor:</span><span className="font-bold">{fmtMoney(r.amount)}</span></div>
                  <div className="flex justify-between"><span className="text-gray-500">Frequência:</span><span className="capitalize">{r.frequency}</span></div>
                  <div className="flex justify-between"><span className="text-gray-500">Dia venc.:</span><span>{r.dayOfMonth}</span></div>
                </div>
                <div className="flex gap-2 mt-4 pt-4 border-t">
                  <button onClick={() => openEdit(r)} className="flex-1 py-2 bg-indigo-50 text-indigo-700 rounded-lg text-sm font-medium hover:bg-indigo-100">✏️ Editar</button>
                  <button onClick={() => handleDelete(r.id)} className="py-2 px-3 text-rose-600 hover:bg-rose-50 rounded-lg">🗑️</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={editing ? 'Editar Recorrência' : 'Nova Recorrência'} size="md"
        footer={<div className="flex justify-end gap-3"><button onClick={() => setModalOpen(false)} className="btn-secondary">Cancelar</button><button onClick={handleSave} className="btn-primary">Salvar</button></div>}>
        <Field label="Nome" required><input className="input-base" value={form.name} onChange={e => setForm({...form, name: e.target.value})} /></Field>
        <div className="grid grid-cols-2 gap-4">
          <Field label="Tipo" required>
            <select className="input-base" value={form.type} onChange={e => setForm({...form, type: e.target.value, category: ''})}>
              <option value="entrada">Entrada</option><option value="saida">Saída</option>
            </select>
          </Field>
          <Field label="Categoria" required>
            <select className="input-base" value={form.category} onChange={e => setForm({...form, category: e.target.value})}>
              <option value="">Selecione...</option>
              {(data.categories || []).filter(c => c.type === form.type).map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
            </select>
          </Field>
          <Field label="Valor (R$)" required><input className="input-base" type="number" step="0.01" value={form.amount} onChange={e => setForm({...form, amount: e.target.value})} /></Field>
          <Field label="Frequência">
            <select className="input-base" value={form.frequency} onChange={e => setForm({...form, frequency: e.target.value})}>
              <option value="mensal">Mensal</option><option value="quinzenal">Quinzenal</option><option value="semanal">Semanal</option><option value="anual">Anual</option>
            </select>
          </Field>
          <Field label="Dia Vencimento"><input className="input-base" type="number" min="1" max="31" value={form.dayOfMonth} onChange={e => setForm({...form, dayOfMonth: e.target.value})} /></Field>
          <Field label="Pagamento">
            <select className="input-base" value={form.paymentMethod} onChange={e => setForm({...form, paymentMethod: e.target.value})}>
              <option value="boleto">Boleto</option><option value="debito">Débito Automático</option><option value="pix">PIX</option><option value="credito">Crédito</option>
            </select>
          </Field>
          <Field label="Início"><input className="input-base" type="date" value={form.startDate} onChange={e => setForm({...form, startDate: e.target.value})} /></Field>
          <Field label="Término (opc.)"><input className="input-base" type="date" value={form.endDate} onChange={e => setForm({...form, endDate: e.target.value})} /></Field>
        </div>
        <label className="flex items-center gap-2 mt-2 cursor-pointer"><input type="checkbox" checked={form.active} onChange={e => setForm({...form, active: e.target.checked})} className="w-4 h-4" /><span className="text-sm text-gray-700">Ativo</span></label>
      </Modal>
    </div>
  );
}

// ============================================================
// RELATÓRIOS
// ============================================================
function ReportsScreen({ data, toast }) {
  const [filter, setFilter] = useState({ type: 'all', dateFrom: '', dateTo: '', category: 'all' });
  const [reportType, setReportType] = useState('general');

  const filtered = useMemo(() => {
    return (data.transactions || []).filter(t => {
      if (filter.type !== 'all' && t.type !== filter.type) return false;
      if (filter.category !== 'all' && t.category !== filter.category) return false;
      if (filter.dateFrom && t.date < filter.dateFrom) return false;
      if (filter.dateTo && t.date > filter.dateTo) return false;
      return true;
    }).sort((a, b) => new Date(a.date) - new Date(b.date));
  }, [data.transactions, filter]);

  const totalEntradas = filtered.filter(t => t.type === 'entrada').reduce((s, t) => s + parseNum(t.amount), 0);
  const totalSaidas = filtered.filter(t => t.type === 'saida').reduce((s, t) => s + parseNum(t.amount), 0);

  const byCategory = {};
  filtered.forEach(t => {
    if (!byCategory[t.category]) byCategory[t.category] = { category: t.category, type: t.type, total: 0, count: 0 };
    byCategory[t.category].total += parseNum(t.amount);
    byCategory[t.category].count++;
  });

  function generatePDF() {
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFillColor(99, 102, 241);
      doc.rect(0, 0, 210, 30, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(20);
      doc.text('FluxoPro - Relatório ' + (reportType === 'general' ? 'Geral' : 'Por Categoria'), 14, 15);
      doc.setFontSize(10);
      doc.text('Gerado em: ' + new Date().toLocaleString('pt-BR'), 14, 23);
      doc.setTextColor(0, 0, 0);
      doc.setFontSize(14);
      doc.text('Resumo Financeiro', 14, 45);
      doc.autoTable({
        startY: 50,
        head: [['Descrição', 'Valor']],
        body: [['Total Entradas', fmtMoney(totalEntradas)], ['Total Saídas', fmtMoney(totalSaidas)], ['Saldo', fmtMoney(totalEntradas - totalSaidas)], ['Lançamentos', String(filtered.length)]],
        theme: 'striped', headStyles: { fillColor: [99, 102, 241] },
      });
      let finalY = doc.lastAutoTable.finalY + 10;
      doc.setFontSize(14);
      doc.text('Detalhamento', 14, finalY);
      doc.autoTable({
        startY: finalY + 5,
        head: [['Data', 'Tipo', 'Categoria', 'Descrição', 'Valor']],
        body: filtered.map(t => [fmtDate(t.date), t.type === 'entrada' ? 'Entrada' : 'Saída', t.category, t.description || '-', fmtMoney(t.amount)]),
        theme: 'striped', headStyles: { fillColor: [99, 102, 241] }, styles: { fontSize: 8 },
      });
      doc.save('relatorio-' + today() + '.pdf');
      toast('PDF gerado', 'success');
    } catch(e) { toast('Erro: ' + e.message, 'error'); }
  }

  function exportCSV() {
    const headers = ['Data', 'Tipo', 'Categoria', 'Descrição', 'Valor', 'Status'];
    const rows = filtered.map(t => [t.date, t.type, t.category, t.description || '', String(t.amount), t.status]);
    const csv = [headers].concat(rows).map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'lancamentos-' + today() + '.csv'; a.click();
    URL.revokeObjectURL(url);
    toast('CSV exportado', 'success');
  }

  return (
    <div className="fade-in">
      <div className="flex items-center justify-between mb-6">
        <div><h1 className="text-3xl font-bold text-gray-800">Relatórios</h1><p className="text-gray-500 mt-1">Análise e exportação</p></div>
        <div className="flex gap-2">
          <button onClick={exportCSV} className="btn-secondary flex items-center gap-2">📊 CSV</button>
          <button onClick={generatePDF} className="btn-primary flex items-center gap-2">📄 PDF</button>
        </div>
      </div>

      <div className="flex gap-2 mb-5">
        <button onClick={() => setReportType('general')} className={'tab-btn ' + (reportType === 'general' ? 'active' : '')}>Geral</button>
        <button onClick={() => setReportType('category')} className={'tab-btn ' + (reportType === 'category' ? 'active' : '')}>Por Categoria</button>
        <button onClick={() => setReportType('monthly')} className={'tab-btn ' + (reportType === 'monthly' ? 'active' : '')}>Mensal</button>
      </div>

      <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-5">
        <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
          <select className="input-base" value={filter.type} onChange={e => setFilter({...filter, type: e.target.value})}>
            <option value="all">Todos os tipos</option><option value="entrada">Entradas</option><option value="saida">Saídas</option>
          </select>
          <select className="input-base" value={filter.category} onChange={e => setFilter({...filter, category: e.target.value})}>
            <option value="all">Todas categorias</option>
            {(data.categories || []).map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
          </select>
          <input type="date" className="input-base" value={filter.dateFrom} onChange={e => setFilter({...filter, dateFrom: e.target.value})} />
          <input type="date" className="input-base" value={filter.dateTo} onChange={e => setFilter({...filter, dateTo: e.target.value})} />
        </div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
        <div className="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl p-5 text-white"><p className="text-sm opacity-90">Entradas</p><p className="text-2xl font-bold mt-1">{fmtMoney(totalEntradas)}</p></div>
        <div className="bg-gradient-to-br from-rose-500 to-red-600 rounded-2xl p-5 text-white"><p className="text-sm opacity-90">Saídas</p><p className="text-2xl font-bold mt-1">{fmtMoney(totalSaidas)}</p></div>
        <div className="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl p-5 text-white"><p className="text-sm opacity-90">Saldo</p><p className="text-2xl font-bold mt-1">{fmtMoney(totalEntradas - totalSaidas)}</p></div>
      </div>

      {reportType === 'category' && (
        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-5">
          <div className="px-5 py-4 border-b"><h3 className="font-bold text-gray-800">Resumo por Categoria</h3></div>
          <table className="w-full">
            <thead className="bg-gray-50"><tr>
              <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Categoria</th>
              <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Tipo</th>
              <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Qtd</th>
              <th className="px-4 py-3 text-right text-xs font-semibold text-gray-600">Total</th>
              <th className="px-4 py-3 text-right text-xs font-semibold text-gray-600">%</th>
            </tr></thead>
            <tbody className="divide-y">
              {Object.values(byCategory).sort((a,b) => b.total - a.total).map((c, i) => {
                const total = c.type === 'entrada' ? totalEntradas : totalSaidas;
                return (
                  <tr key={i} className="hover:bg-gray-50">
                    <td className="px-4 py-3 text-sm font-medium">{c.category}</td>
                    <td className="px-4 py-3"><span className={'chip ' + (c.type === 'entrada' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700')}>{c.type === 'entrada' ? 'Entrada' : 'Saída'}</span></td>
                    <td className="px-4 py-3 text-sm">{c.count}</td>
                    <td className={'px-4 py-3 text-sm font-bold text-right ' + (c.type === 'entrada' ? 'text-emerald-600' : 'text-rose-600')}>{fmtMoney(c.total)}</td>
                    <td className="px-4 py-3 text-sm text-right">{total ? ((c.total / total) * 100).toFixed(1) : 0}%</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div className="px-5 py-4 border-b"><h3 className="font-bold text-gray-800">Detalhamento ({filtered.length})</h3></div>
        <div className="overflow-x-auto">
          <table className="w-full">
            <thead className="bg-gray-50"><tr>
              <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Data</th>
              <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Tipo</th>
              <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Categoria</th>
              <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600">Descrição</th>
              <th className="px-4 py-3 text-right text-xs font-semibold text-gray-600">Valor</th>
            </tr></thead>
            <tbody className="divide-y">
              {filtered.length === 0 ? <tr><td colSpan="5" className="text-center py-12 text-gray-400">Nenhum registro</td></tr> : filtered.map(t => (
                <tr key={t.id} className="hover:bg-gray-50">
                  <td className="px-4 py-3 text-sm">{fmtDate(t.date)}</td>
                  <td className="px-4 py-3"><span className={'chip ' + (t.type === 'entrada' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700')}>{t.type === 'entrada' ? 'Entrada' : 'Saída'}</span></td>
                  <td className="px-4 py-3 text-sm">{t.category}</td>
                  <td className="px-4 py-3 text-sm text-gray-600">{t.description || '-'}</td>
                  <td className={'px-4 py-3 text-sm font-bold text-right ' + (t.type === 'entrada' ? 'text-emerald-600' : 'text-rose-600')}>{fmtMoney(t.amount)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// DADOS / BACKUP
// ============================================================
function DataScreen({ data, setData, toast }) {
  const fileInputRef = useRef(null);

  function exportJSON() {
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'fluxopro-backup-' + today() + '.json'; a.click();
    URL.revokeObjectURL(url);
    toast('Backup JSON exportado', 'success');
  }

  function importJSON(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!imported.transactions || !imported.categories) { toast('Arquivo inválido', 'error'); return; }
        if (confirm('Isso substituirá todos os dados. Continuar?')) {
          setData(imported);
          toast('Dados importados', 'success');
        }
      } catch(err) { toast('Erro: ' + err.message, 'error'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  function exportCSVFull() {
    const headers = ['Data', 'Transação', 'Vencimento', 'Tipo', 'Categoria', 'Descrição', 'Valor', 'Status', 'Pagamento'];
    const rows = (data.transactions || []).map(t => [t.date, t.transactionDate, t.dueDate, t.type, t.category, t.description || '', String(t.amount), t.status, t.paymentMethod || '']);
    const csv = [headers].concat(rows).map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'todos-lancamentos-' + today() + '.csv'; a.click();
    URL.revokeObjectURL(url);
    toast('CSV exportado', 'success');
  }

  function clearAll() {
    if (!confirm('ATENÇÃO: Isso apagará TODOS os dados. Continuar?')) return;
    if (!confirm('Tem certeza? Esta ação é irreversível.')) return;
    setData({
      accounts: [{ id: uid(), name: 'Conta Principal', bank: '', agency: '', account: '', balance: 0, color: '#6366f1' }],
      categories: DEFAULT_CATS, transactions: [], recurring: [], creditCards: [], piggyBanks: [], loans: [], investments: [], billsPay: [], billsRecv: [], transfers: [], settings: { currency: 'BRL' },
    });
    toast('Dados limpos', 'success');
  }

  return (
    <div className="fade-in">
      <div className="mb-6"><h1 className="text-3xl font-bold text-gray-800">Dados e Backup</h1><p className="text-gray-500 mt-1">Exporte, importe e gerencie</p></div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
          <div className="flex items-center gap-3 mb-4"><div className="w-12 h-12 bg-indigo-100 rounded-xl flex items-center justify-center text-2xl">💾</div><div><h3 className="font-bold">Exportar JSON</h3><p className="text-sm text-gray-500">Backup completo</p></div></div>
          <p className="text-sm text-gray-600 mb-4">Exporta todos os dados em formato JSON.</p>
          <button onClick={exportJSON} className="btn-primary w-full">Exportar JSON</button>
        </div>

        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
          <div className="flex items-center gap-3 mb-4"><div className="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center text-2xl"></div><div><h3 className="font-bold">Importar JSON</h3><p className="text-sm text-gray-500">Restaurar backup</p></div></div>
          <p className="text-sm text-gray-600 mb-4">Importe um arquivo JSON. Substituirá os dados atuais.</p>
          <input ref={fileInputRef} type="file" accept=".json" onChange={importJSON} className="hidden" />
          <button onClick={() => fileInputRef.current.click()} className="btn-success w-full">Selecionar Arquivo</button>
        </div>

        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
          <div className="flex items-center gap-3 mb-4"><div className="w-12 h-12 bg-amber-100 rounded-xl flex items-center justify-center text-2xl">📊</div><div><h3 className="font-bold">Exportar CSV</h3><p className="text-sm text-gray-500">Planilha completa</p></div></div>
          <p className="text-sm text-gray-600 mb-4">Exporta todos os lançamentos em CSV (Excel).</p>
          <button onClick={exportCSVFull} className="btn-primary w-full" style={{background: 'linear-gradient(135deg, #f59e0b, #d97706)'}}>Exportar CSV</button>
        </div>

        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
          <div className="flex items-center gap-3 mb-4"><div className="w-12 h-12 bg-rose-100 rounded-xl flex items-center justify-center text-2xl">🗑️</div><div><h3 className="font-bold">Limpar Tudo</h3><p className="text-sm text-gray-500">Resetar sistema</p></div></div>
          <p className="text-sm text-gray-600 mb-4">Remove todos os dados. Ação irreversível!</p>
          <button onClick={clearAll} className="btn-danger w-full">Limpar Tudo</button>
        </div>
      </div>

      <div className="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl p-6 text-white">
        <h3 className="text-xl font-bold mb-3">💾 Sobre o armazenamento</h3>
        <p className="text-indigo-100 leading-relaxed">
          Seus dados são armazenados localmente no navegador usando <strong>localStorage</strong> (banco de dados JSON). 
          Cada usuário possui dados totalmente separados. Faça backups regulares exportando o JSON.
          Os dados permanecem no seu dispositivo e nunca são enviados para servidores externos.
        </p>
      </div>
    </div>
  );
}

// ============================================================
// SOBRE / AJUDA
// ============================================================
function AboutScreen() {
  return (
    <div className="fade-in max-w-4xl">
      <div className="mb-6"><h1 className="text-3xl font-bold text-gray-800">Sobre o FluxoPro</h1><p className="text-gray-500 mt-1">MVP v0.1.0 - Projeto de Estudo</p></div>

              <p className="font-semibold text-blue-800">Taxa de Poupança</p>
              <code className="block mt-1 text-sm bg-white p-2 rounded font-mono">Taxa = ((Entradas - Saídas) / Entradas) × 100</code>
              <p className="text-sm mt-2">Indica quanto % da renda está sendo poupado. Meta saudável: acima de 20%</p>
            </div>
            <div className="bg-purple-50 border-l-4 border-purple-500 p-4 rounded">
              <p className="font-semibold text-purple-800">Reserva de Emergência (meses)</p>
              <code className="block mt-1 text-sm bg-white p-2 rounded font-mono">Reserva = (Contas + Caixinhas) / Despesas Mensais Médias</code>

              <p className="text-sm mt-2">Capacidade de pagar contas no curto prazo</p>
            </div>
            <div className="bg-rose-50 border-l-4 border-rose-500 p-4 rounded">
              <p className="font-semibold text-rose-800">Endividamento</p>
              <code className="block mt-1 text-sm bg-white p-2 rounded font-mono">Endividamento = (Empréstimos / Patrimônio Líquido) × 100</code>
              <p className="text-sm mt-2">Quanto do seu patrimônio está comprometido com dívidas</p>
            </div>
            <div className="bg-indigo-50 border-l-4 border-indigo-500 p-4 rounded">
              <p className="font-semibold text-indigo-800">Cartão de Crédito - Disponível</p>
              <code className="block mt-1 text-sm bg-white p-2 rounded font-mono">Disponível = Limite Total - Gastos no Mês Atual</code>
            </div>
            <div className="bg-teal-50 border-l-4 border-teal-500 p-4 rounded">
              <p className="font-semibold text-teal-800">Empréstimo - Parcela</p>
              <code className="block mt-1 text-sm bg-white p-2 rounded font-mono">Parcela = Valor Total / Número de Parcelas</code>

          </div>
        </div>

        <div className="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl p-6 text-white">
          <h2 className="text-xl font-bold mb-3">💡 Dicas de Uso</h2>
          <ul className="space-y-2 text-indigo-100">
            <li>✓ Configure suas contas bancárias com saldos iniciais</li>
            <li>✓ Cadastre recorrências para contas fixas (luz, água, aluguel)</li>
            <li>✓ Use "Gerar Mensal" para criar lançamentos automáticos</li>
            <li>✓ Use caixinhas para guardar dinheiro para objetivos</li>
            <li>✓ Registre empréstimos e acompanhe a quitação</li>
            <li>✓ Monitore investimentos e diversifique</li>
            <li>✓ Use contas a pagar/receber para não esquecer vencimentos</li>
            <li>✓ Exporte backups JSON regularmente</li>
            <li>✓ Revise o dashboard semanalmente</li>

        </div>

        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
          <h2 className="text-xl font-bold text-gray-800 mb-3">Funcionalidades</h2>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            {[
              'Dashboard com KPIs financeiros avançados',
              'Lançamentos com 3 datas (cadastro, transação, vencimento)',
              'Contas bancárias múltiplas (individual/consolidado)',
              'Transferências entre contas e cartões',
              'Cartões de crédito com limite e controle',
              'Caixinhas de economia (tipo Nubank)',

              'Backup e restore em JSON',
              'Sistema multi-usuário',
              'Interface responsiva e moderna',
            ].map((f, i) => (
              <div key={i} className="flex items-center gap-2 text-gray-700">
                <span className="text-emerald-500">✓</span><span className="text-sm">{f}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="bg-slate-800 rounded-2xl p-6 text-white text-center">
          <p className="text-sm text-slate-300">FluxoPro MVP v0.1.0</p>
          <p className="font-bold text-lg mt-1">Walney Moreira Klein</p>
          <p className="text-slate-300 text-sm mt-1">walneyk@hotmail.com</p>
          <p className="text-slate-400 text-xs mt-3">© 2026 - Projeto de Estudo - Todos os direitos reservados</p>
          <p className="text-slate-500 text-xs mt-2">Desenvolvido com React + Tailwind CSS</p>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// APP PRINCIPAL
// ============================================================
function App() {
  const [user, setUser] = useState(DB.get('currentUser'));
  const [data, setData] = useState(null);
  const [currentView, setCurrentView] = useState('dashboard');
  const [toast, setToast] = useState(null);

  useEffect(() => {
    if (user) {
      let userData = DB.get('data_' + user.id);
      if (!userData) {
        userData = {
          accounts: [{ id: uid(), name: 'Conta Principal', bank: '', agency: '', account: '', balance: 0, color: '#6366f1' }],
          categories: DEFAULT_CATS,
          transactions: [],
          recurring: [],
          creditCards: [],
          piggyBanks: [],
          loans: [],
          investments: [],
          billsPay: [],
          billsRecv: [],
          transfers: [],
          settings: { currency: 'BRL' },
        };
        DB.set('data_' + user.id, userData);
      }
      // Migração: adiciona campos novos se não existirem
      if (!userData.piggyBanks) userData.piggyBanks = [];
      if (!userData.loans) userData.loans = [];
      if (!userData.investments) userData.investments = [];
      if (!userData.billsPay) userData.billsPay = [];
      if (!userData.billsRecv) userData.billsRecv = [];
      if (!userData.transfers) userData.transfers = [];
      setData(userData);
    }
  }, [user]);

  useEffect(() => {
    if (user && data) {
      DB.set('data_' + user.id, data);
    }
  }, [data, user]);

  function handleLogin(u) { setUser(u); }
  function handleLogout() { DB.del('currentUser'); setUser(null); }
  function showToast(msg, type) { setToast({ message: msg, type: type || 'info', key: Date.now() }); }

  if (!user) return <LoginScreen onLogin={handleLogin} />;
  if (!data) return <div className="min-h-screen flex items-center justify-center">Carregando...</div>;

  return (
    <div className="flex min-h-screen bg-gray-50">
      <Sidebar currentView={currentView} setCurrentView={setCurrentView} user={user} onLogout={handleLogout} />
      <main className="flex-1 overflow-y-auto">
        <div className="p-8">
          <div className="mb-6 flex items-center justify-between bg-white rounded-xl p-4 shadow-sm border border-gray-100">
            <div>
              <p className="text-sm text-gray-500">Bem-vindo(a),</p>
              <p className="text-lg font-bold text-gray-800">{user.name}</p>
            </div>
            <div className="text-right">
              <p className="text-xs text-gray-500">FluxoPro MVP</p>
              <p className="text-sm font-bold text-indigo-600">v0.1.0</p>
            </div>
          </div>

          {currentView === 'dashboard' && <Dashboard data={data} />}
          {currentView === 'transactions' && <TransactionsScreen data={data} setData={setData} toast={showToast} />}
          {currentView === 'recurring' && <RecurringScreen data={data} setData={setData} toast={showToast} />}
          {currentView === 'accounts' && <AccountsScreen data={data} setData={setData} toast={showToast} />}
          {currentView === 'transfers' && <TransfersScreen data={data} setData={setData} toast={showToast} />}
          {currentView === 'creditcards' && <CreditCardsScreen data={data} setData={setData} toast={showToast} />}
          {currentView === 'piggybanks' && <PiggyBanksScreen data={data} setData={setData} toast={showToast} />}
          {currentView === 'bills' && <BillsScreen data={data} setData={setData} toast={showToast} />}
          {currentView === 'loans' && <LoansScreen data={data} setData={setData} toast={showToast} />}
          {currentView === 'investments' && <InvestmentsScreen data={data} setData={setData} toast={showToast} />}
          {currentView === 'categories' && <CategoriesScreen data={data} setData={setData} toast={showToast} />}
          {currentView === 'reports' && <ReportsScreen data={data} toast={showToast} />}
          {currentView === 'data' && <DataScreen data={data} setData={setData} toast={showToast} />}
          {currentView === 'about' && <AboutScreen />}
        </div>
      </main>
      {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} key={toast.key} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
